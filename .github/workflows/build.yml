name: build apk

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: split project.txt into files
        run: python3 -c "import os,re;src=open('project.txt',encoding='utf-8').read();p=re.split(r'^### FILE: (.+)$',src,flags=re.M);[(os.makedirs(os.path.dirname(p[i].strip()) or '.',exist_ok=True),open(p[i].strip(),'w',encoding='utf-8').write(p[i+1].lstrip(chr(10)))) for i in range(1,len(p),2)]"

      - name: build debug apk
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
